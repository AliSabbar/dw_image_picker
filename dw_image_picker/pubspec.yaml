name: dw_image_picker
description: Choose images/videos from the library, crop images, and capture new photos/videos with ease.
repository: https://github.com/DeveloperWaybee/dw_image_picker/tree/main/dw_image_picker
issue_tracker: https://github.com/DeveloperWaybee/dw_image_picker/issues
homepage: https://waybeetech.com/

version: 1.2.18

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  dw_image_picker_platform_interface:
    path: ../dw_image_picker_platform_interface
  dw_image_picker_ios:
    path: ../dw_image_picker_ios
  dw_image_picker_android:
    path: ../dw_image_picker_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: dw_image_picker_android
      ios:
        default_package: dw_image_picker_ios
